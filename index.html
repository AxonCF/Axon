<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXON Arena</title>
  <style>
    :root{--bg:#0a0b10;--panel:#11131a;--panel2:#171a24;--line:#242838;--text:#f4f7ff;--muted:#8e97ab;--accent:#ff6a00;--ok:#34d399;--r:18px}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#0b0d14,#08090d);color:var(--text)}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#0d0f16;border-right:1px solid var(--line);padding:22px}.logo{font-size:28px;font-weight:800;letter-spacing:2px}.muted{color:var(--muted)}
    .navbtn,.btn{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
    .nav{display:flex;flex-direction:column;gap:10px;margin-top:20px}.main{padding:24px}.hidden{display:none}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.mode{padding:18px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:center}.mode.active{border-color:var(--accent);transform:translateY(-2px)}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:14px;border-radius:14px;background:var(--panel2)}
    .queue{margin-top:18px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#171a24,#10131b)}
    .players{display:grid;grid-template-columns:1fr 1fr;gap:14px}.player{padding:12px;border-radius:12px;background:var(--panel2)}
    .chat{height:220px;overflow:auto;border:1px solid var(--line);padding:12px;border-radius:14px;background:#0d1018}.msg{margin-bottom:10px;padding:10px;border-radius:12px;background:#1a1e2b}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f121a;color:#fff}
    .row{display:flex;gap:10px}.hero{font-size:34px;font-weight:800}.accent{color:var(--accent)} .ok{color:var(--ok)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid,.players,.modes{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">AXON</div>
    <div class="muted">Arena Matchmaking</div>
    <div class="nav">
      <button class="navbtn" onclick="show('dashboard')">Dashboard</button>
      <button class="navbtn" onclick="show('queue')">Queue</button>
      <button class="navbtn" onclick="show('lobby')">Lobby</button>
      <button class="navbtn" onclick="show('profile')">Profile</button>
    </div>
  </aside>

  <main class="main">
    <section id="auth">
      <div class="card" style="max-width:480px;margin:auto;margin-top:8vh">
        <div class="hero">Welcome to <span class="accent">AXON</span></div>
        <p class="muted">FACEIT-like competitive queue platform</p>
        <div class="row"><input id="nick" placeholder="Nickname"><button class="btn" onclick="login()">Enter</button></div>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="top"><div><div class="hero">Dashboard</div><div class="muted">Competitive hub</div></div><div id="hello"></div></div>
      <div class="grid">
        <div class="card">
          <h2>Queue Modes</h2>
          <div class="modes" id="modes"></div>
          <div class="queue">
            <div id="queueStatus">Not searching</div>
            <div class="muted" id="eta">Estimated wait: --</div>
            <div class="row" style="margin-top:12px"><button class="btn" onclick="toggleQueue()">Search Match</button><button class="btn" onclick="cancelQueue()">Cancel</button></div>
          </div>
        </div>
        <div class="card">
          <h3>Live Search</h3>
          <div class="stats" id="counters"></div>
        </div>
      </div>
    </section>

    <section id="queue" class="hidden"><div class="card"><h2>Active Queue</h2><p id="queuePanel">Select mode and start search.</p></div></section>

    <section id="lobby" class="hidden">
      <div class="grid">
        <div class="card">
          <h2>Match Lobby</h2>
          <div class="players" id="players"></div>
          <div style="margin-top:14px"><label class="muted">Lobby Code</label><input id="lobbyCode" placeholder="Paste room/server code"></div>
        </div>
        <div class="card">
          <h3>Lobby Chat</h3>
          <div class="chat" id="chat"></div>
          <div class="row" style="margin-top:10px"><input id="chatInput" placeholder="Type message"><button class="btn" onclick="sendChat()">Send</button></div>
        </div>
      </div>
    </section>

    <section id="profile" class="hidden">
      <div class="card">
        <h2>Player Profile</h2>
        <div class="stats">
          <div class="stat"><b id="pNick">-</b><div class="muted">Nickname</div></div>
          <div class="stat"><b>1842</b><div class="muted">ELO</div></div>
          <div class="stat"><b>61%</b><div class="muted">Winrate</div></div>
          <div class="stat"><b>1.37</b><div class="muted">K/D</div></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
const state={user:null,mode:'Solo',searching:false,counters:{Solo:124,Duo:58,Trio:21,Stack4:8,Stack5:12},chat:[],players:[]};
const modes=['Solo','Duo','Trio','Stack4','Stack5'];
function qs(id){return document.getElementById(id)}
function renderModes(){qs('modes').innerHTML='';modes.forEach(m=>{const d=document.createElement('div');d.className='mode'+(state.mode===m?' active':'');d.innerHTML=`<b>${m}</b>`;d.onclick=()=>{state.mode=m;renderModes()};qs('modes').appendChild(d)})}
function renderCounters(){qs('counters').innerHTML='';Object.entries(state.counters).forEach(([k,v])=>{const d=document.createElement('div');d.className='stat';d.innerHTML=`<b>${v}</b><div class='muted'>Searching ${k}</div>`;qs('counters').appendChild(d)})}
function login(){const nick=qs('nick').value.trim()||'Player';state.user=nick;qs('hello').innerHTML=`<span class='ok'>●</span> ${nick}`;qs('pNick').textContent=nick;show('dashboard')}
function show(id){['auth','dashboard','queue','lobby','profile'].forEach(x=>qs(x).classList.add('hidden'));qs(id).classList.remove('hidden')}
function toggleQueue(){state.searching=true;qs('queueStatus').textContent=`Searching ${state.mode}...`;qs('eta').textContent='Estimated wait: 15-40 sec';qs('queuePanel').textContent=`In queue for ${state.mode}`;show('queue');setTimeout(createLobby,2500)}
function cancelQueue(){state.searching=false;qs('queueStatus').textContent='Queue cancelled';}
function createLobby(){state.players=['You','Teammate 1','Enemy 1','Enemy 2','Enemy 3']; qs('players').innerHTML=''; state.players.forEach(p=>{const d=document.createElement('div');d.className='player';d.textContent=p;qs('players').appendChild(d)}); show('lobby'); addMsg('System: Lobby created. Paste code and coordinate.')}
function addMsg(t){const d=document.createElement('div');d.className='msg';d.textContent=t;qs('chat').appendChild(d);qs('chat').scrollTop=qs('chat').scrollHeight}
function sendChat(){const v=qs('chatInput').value.trim(); if(!v) return; addMsg((state.user||'You')+': '+v); qs('chatInput').value=''}
renderModes(); renderCounters(); show('auth');
</script>
</body>
</html>
