<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON | Matchmaking</title>
    <style>
        :root { --neon: #00ffff; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Arial', sans-serif; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 90%; max-width: 1000px; padding: 20px; }
        
        /* Меню выбора */
        .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .mode-card { border: 1px solid #222; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; }
        .mode-card:hover { border-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
        .mode-card.active { background: var(--neon); color: black; font-weight: bold; }

        /* Лобби и Чат */
        #lobby-room { display: none; margin-top: 30px; border: 1px solid #333; border-radius: 15px; padding: 20px; }
        .chat-box { height: 200px; background: #111; overflow-y: auto; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        input[type="text"] { width: 70%; padding: 10px; background: #222; border: none; color: white; border-radius: 5px; }
        .send-btn { width: 25%; padding: 10px; background: var(--neon); border: none; cursor: pointer; font-weight: bold; }

        .stats { margin-top: 40px; color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>AXON <span style="font-size: 1rem; color: #555;">BETA</span></h1>
        
        <div id="main-menu">
            <h3>ВЫБЕРИ РЕЖИМ ПОИСКА:</h3>
            <div class="modes">
                <div class="mode-card" onclick="selectMode(this, 'solo')">SOLO<br><small>1 vs 1</small></div>
                <div class="mode-card" onclick="selectMode(this, 'duo')">DUO<br><small>2 vs 2</small></div>
                <div class="mode-card" onclick="selectMode(this, 'trio')">TRIO<br><small>3 vs 3</small></div>
                <div class="mode-card" onclick="selectMode(this, 'squad')">SQUAD<br><small>5 vs 5</small></div>
            </div>
            <button class="send-btn" style="width: 100%; margin-top: 20px;" onclick="startMatchmaking()">Искать матч</button>
            
            <div class="stats">
                В поиске: <span id="online-count">14</span> игроков
            </div>
        </div>

        <div id="lobby-room">
            <h2 id="match-id">МАТЧ НАЙДЕН #4921</h2>
            <div class="chat-box" id="chat">
                <p style="color: #555;">[Система] Добро пожаловать в лобби AXON!</p>
            </div>
            <input type="text" id="msgInput" placeholder="Напишите сообщение...">
            <button class="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
            
            <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                <p>Код лобби для CS/Игры:</p>
                <input type="text" style="width: 100%; color: var(--neon);" value="connect 127.0.0.1:27015; password axon" readonly>
            </div>
        </div>
    </div>

    <script>
        let selectedMode = '';

        function selectMode(el, mode) {
            document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedMode = mode;
        }

        function startMatchmaking() {
            if(!selectedMode) return alert('Выбери режим!');
            alert('Поиск ' + selectedMode + ' матча начат...');
            
            // Имитация нахождения матча через 3 секунды
            setTimeout(() => {
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('lobby-room').style.display = 'block';
            }, 3000);
        }

        function sendMessage() {
            let input = document.getElementById('msgInput');
            if(input.value) {
                let p = document.createElement('p');
                p.innerHTML = `<b>Ты:</b> ${input.value}`;
                document.getElementById('chat').appendChild(p);
                input.value = '';
            }
        }
    </script>
</body>
</html>
